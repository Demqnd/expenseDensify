services:
  db:
    image: postgres:16-alpine
    container_name: expensedensify-db
    environment:
      POSTGRES_DB: expense_densify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Connor123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_densify"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expensedensify-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=expense_densify;Username=postgres;Password=Connor123
      OcrService__BaseUrl: http://ocr:8010
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
    ports:
      - "5000:5000"

  ocr:
    build:
      context: ./ocr_service
      dockerfile: Dockerfile
    container_name: expensedensify-ocr
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "8010:8010"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expensedensify-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
      NEXT_PUBLIC_OCR_API_BASE_URL: http://localhost:5000/api
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3003:3000"

volumes:
  postgres_data:
